<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\Windows\system32\cmd.exe - Taddy OS</title>
  <!-- Puter.js SDK (No API Keys Required) -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg: #0c0c0c;
      --text: #cccccc;
      --prompt: #cccccc;
      --error: #ff5555;
      --highlight: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #terminal {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin-bottom: 4px; line-height: 1.3; font-size: 15px; }
    .prompt { color: var(--prompt); }
    .error { color: var(--error); }
    .highlight { color: var(--highlight); font-weight: bold; }
    .input-line { display: flex; align-items: center; margin-top: 4px; }
    input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      flex: 1;
      margin-left: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="line">Microsoft Windows [Version 10.0.22631.3007]</div>
    <div class="line">(c) Microsoft Corporation. All rights reserved.</div>
    <div class="line" style="margin-bottom: 12px;">Type <span class="highlight">HELP</span> for built-in CMD utilities, or type any command for live AI evaluation.</div>
  </div>
  <div class="input-line">
    <span class="prompt">C:\Users\visitor&gt;&nbsp;</span>
    <input type="text" id="cmdInput" autofocus autocomplete="off" spellcheck="false">
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('cmdInput');

    const commandHistory = [];
    let historyIndex = -1;

    // Auto-focus input when clicking anywhere on screen
    document.body.addEventListener('click', () => input.focus());

    function printLine(text, className = '') {
      const line = document.createElement('div');
      line.className = 'line ' + className;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      return line;
    }

    input.addEventListener('keydown', async (e) => {
      // Arrow Up / Down Command History
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (commandHistory.length > 0 && historyIndex > 0) {
          historyIndex--;
          input.value = commandHistory[historyIndex];
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          input.value = commandHistory[historyIndex];
        } else {
          historyIndex = commandHistory.length;
          input.value = '';
        }
      } else if (e.key === 'Enter') {
        const command = input.value.trim();
        if (!command) return;

        printLine(`C:\\Users\\visitor> ${command}`, 'prompt');
        commandHistory.push(command);
        historyIndex = commandHistory.length;
        input.value = '';

        const lower = command.toLowerCase();

        if (lower === 'cls' || lower === 'clear') {
          terminal.innerHTML = '';
        } else if (lower === 'help') {
          printLine(
            'For more information on a specific command, type HELP command-name\n\n' +
            'CLS            Clears the screen.\n' +
            'DIR            Displays a list of files and subdirectories in a directory.\n' +
            'TYPE           Displays the contents of a text file (e.g., TYPE bio.txt).\n' +
            'VER            Displays the Windows version.\n' +
            'WHOAMI         Displays current logged-in user identity.\n' +
            'EXIT           Quits the CMD.exe program.\n\n' +
            '* Any unrecognized command will be evaluated live by the AI daemon.',
            'line'
          );
        } else if (lower === 'ver') {
          printLine('Microsoft Windows [Version 10.0.22631.3007]', 'line');
        } else if (lower === 'whoami') {
          printLine('TADDY-PC\\visitor', 'line');
        } else if (lower === 'dir') {
          printLine(
            ' Volume in drive C has no label.\n' +
            ' Volume Serial Number is A8F4-99B2\n\n' +
            ' Directory of C:\\Users\\visitor\n\n' +
            '08/26/2026  10:00 AM    <DIR>          .\n' +
            '08/26/2026  10:00 AM    <DIR>          ..\n' +
            '08/26/2026  10:00 AM             1,240 bio.txt\n' +
            '08/26/2026  10:00 AM               680 skills.txt\n' +
            '08/26/2026  10:00 AM               920 projects.txt\n' +
            '               3 File(s)          2,840 bytes\n' +
            '               2 Dir(s)  452,104,220,672 bytes free',
            'line'
          );
        } else if (lower === 'type bio.txt' || lower === 'cat bio.txt' || lower === 'about') {
          printLine(
            '[NAME]: Taddy\n' +
            '[ROLE]: Software Development Enthusiast & Full-Stack Creator\n' +
            '[INTERESTS]: Building practical apps, gaming, cars, video editing, gym/fitness.\n' +
            '[SPECIALTY]: Building by doing... and landing perfectly timed, ruthless roasts.',
            'line'
          );
        } else if (lower === 'type skills.txt') {
          printLine(
            '[CORE LANGUAGES]: Java, JavaScript, TypeScript\n' +
            '[FRAMEWORKS]: React.js, Next.js, Spring Boot, Tailwind CSS\n' +
            '[TOOLS & DATABASES]: PostgreSQL, REST APIs, Git, GitHub, Electron, Netlify',
            'line'
          );
        } else if (lower === 'type projects.txt') {
          printLine(
            '[PROJECTS]: Full-Stack Websites, Management Systems, Desktop Applications, REST APIs, 3D Editors.',
            'line'
          );
        } else if (lower === 'exit') {
          printLine('Process terminated. Close window or refresh page.', 'line');
        } else {
          const statusElement = printLine('Executing command...', 'line');
          await fetchAIResponse(command, statusElement);
        }
      }
    });

    async function fetchAIResponse(userPrompt, statusElement) {
      try {
        const systemPrompt = "System Role: You are the sarcastic Windows Command Prompt (cmd.exe) AI backend for Taddy (a software developer skilled in Java, JS, TS, React, Next.js, Spring Boot who loves gaming, cars, fitness, and roasting people). Answer questions about Taddy or software engineering accurately. If the user types invalid CMD commands, syntax errors, silly inputs, or trash talk, deliver a perfectly timed, funny Windows CMD style roast. Keep all responses under 3 sentences.";

        const response = await puter.ai.chat(
          `${systemPrompt}\n\nUser Input: ${userPrompt}`,
          { model: 'gemini-3.5-flash' }
        );

        const replyText = response.toString().trim();
        statusElement.textContent = replyText;
      } catch (err) {
        statusElement.textContent = `'${userPrompt}' is not recognized as an internal or external command, operable program or batch file.`;
        statusElement.className = 'line error';
      }
    }
  </script>
</body>
</html>
