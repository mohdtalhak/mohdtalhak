<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Only Responsive Web Terminal</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #00ff66;
      --prompt: #58a6ff;
      --error: #ff7b72;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #terminal {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin-bottom: 8px; line-height: 1.4; }
    .prompt { color: var(--prompt); font-weight: bold; }
    .error { color: var(--error); }
    .input-line { display: flex; align-items: center; margin-top: 12px; }
    input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      flex: 1;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="line">Real-Time Terminal Interface</div>
    <div class="line">Type <span style="color:#f2cc60">help</span> for built-in utilities, or type any command/question for live evaluation.</div>
    <div class="line" style="color: #8b949e;">-------------------------------------------------------------------</div>
  </div>
  <div class="input-line">
    <span class="prompt">visitor@:~$</span>
    <input type="text" id="cmdInput" autofocus placeholder="Type command here..." autocomplete="off">
  </div>

  <script>
    const ENCODED_KEY = "QVEuQWI4Uk42SzlwQ2g1cUJYeWlnWkRLZG9aM1VlTHcwLTZmQ1JRT1JmVXNwN1ZYMnoyMUE=";
    const GEMINI_API_KEY = atob(ENCODED_KEY);

    const terminal = document.getElementById('terminal');
    const input = document.getElementById('cmdInput');

    function printLine(text, className = '') {
      const line = document.createElement('div');
      line.className = 'line ' + className;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      return line;
    }

    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const command = input.value.trim();
        if (!command) return;

        printLine(`visitor@:~$ ${command}`, 'prompt');
        input.value = '';

        const lower = command.toLowerCase();

        if (lower === 'help') {
          printLine('Available Commands:\n  - help: Display options\n  - cat bio.txt: Display developer details\n  - clear: Clear screen', 'line');
        } else if (lower === 'cat bio.txt' || lower === 'whoami' || lower === 'about') {
          printLine(
            '[NAME]: Taddy\n' +
            '[ROLE]: Software Development Enthusiast & Full-Stack Creator\n' +
            '[STACK]: Java, JavaScript, TypeScript, React.js, Next.js, Spring Boot, PostgreSQL, Tailwind CSS, Electron\n' +
            '[PROJECTS]: Web Apps, Management Systems, Desktop Apps, REST APIs, 3D Editors\n' +
            '[HOBBIES]: Gaming, Cars, Gym/Fitness, Video Editing & Building Random Stuff\n' +
            '[SPECIALTY]: Building by doing... and landing perfectly timed, ruthless roasts.', 
            'line'
          );
        } else if (lower === 'clear') {
          terminal.innerHTML = '';
        } else {
          const statusElement = printLine('Terminal: Thinking...', 'line');
          await fetchAIResponse(command, statusElement);
        }
      }
    });

    async function fetchAIResponse(userPrompt, statusElement) {
      const models = ['gemini-flash-latest', 'gemini-3.6-flash'];
      
      for (const model of models) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: {
                parts: [{ 
                  text: "You are the witty, sarcastic Linux terminal AI for Taddy (a software developer skilled in Java, JS, TS, React, Next.js, and Spring Boot who loves gaming, cars, fitness, and roasting people). Answer questions about Taddy or software engineering accurately. If the user types invalid shell syntax, silly inputs, or trash talks, deliver a perfectly timed, hilarious roast or sarcastic comeback. Keep all responses under 3 sentences." 
                }]
              },
              contents: [{ parts: [{ text: userPrompt }] }]
            })
          });

          const data = await response.json();

          if (data.candidates && data.candidates[0].content.parts[0].text) {
            statusElement.textContent = `Terminal: ${data.candidates[0].content.parts[0].text.trim()}`;
            return;
          } else if (data.error && (data.error.code === 429 || (data.error.message && (data.error.message.includes('high demand') || data.error.message.includes('quota'))))) {
            continue; // Catch quota/high demand limits and failover to next model
          } else {
            statusElement.textContent = `[ERROR] ${data.error ? data.error.message : 'Unable to generate response.'}`;
            statusElement.className = 'line error';
            return;
          }
        } catch (err) {
          continue;
        }
      }

      statusElement.textContent = `[ERROR] Rate limit or quota exceeded. Please wait 30 seconds before sending another command.`;
      statusElement.className = 'line error';
    }
  </script>
</body>
</html>
