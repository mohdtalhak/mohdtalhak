<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mohdtalhak // Live AI Terminal</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #00ff66;
      --prompt: #58a6ff;
      --error: #ff7b72;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #terminal {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin-bottom: 8px; line-height: 1.4; }
    .prompt { color: var(--prompt); font-weight: bold; }
    .error { color: var(--error); }
    .input-line { display: flex; align-items: center; margin-top: 12px; }
    input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      flex: 1;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="line">PROFILE_OS v3.0 (Real-Time Terminal Interface)</div>
    <div class="line">Type <span style="color:#f2cc60">help</span> for built-in utilities, or type any command/question for live AI evaluation.</div>
    <div class="line" style="color: #8b949e;">-------------------------------------------------------------------</div>
  </div>
  <div class="input-line">
    <span class="prompt">visitor@mohdtalhak:~$</span>
    <input type="text" id="cmdInput" autofocus placeholder="Type command here..." autocomplete="off">
  </div>

  <script>
    // PASTE YOUR GEMINI API KEY INSIDE THE QUOTES BELOW
    const GEMINI_API_KEY = "AQ.Ab8RN6KzMH8CLRxDkozywCMAN8CvipRmiL5Wv9XMqMvCisHVVg";

    const terminal = document.getElementById('terminal');
    const input = document.getElementById('cmdInput');

    function printLine(text, className = '') {
      const line = document.createElement('div');
      line.className = 'line ' + className;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const command = input.value.trim();
        if (!command) return;

        printLine(`visitor@mohdtalhak:~$ ${command}`, 'prompt');
        input.value = '';

        const lower = command.toLowerCase();

        if (lower === 'help') {
          printLine('Available Commands:\n  - help: Display options\n  - cat bio.txt: Display developer details\n  - clear: Clear screen', 'line');
        } else if (lower === 'cat bio.txt') {
          printLine('[IDENTITY]: Full-Stack & Systems Developer\n[STACK]: Python, JavaScript, Docker, C++\n[STATUS]: Building interactive software.', 'line');
        } else if (lower === 'clear') {
          terminal.innerHTML = '';
        } else {
          if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
            printLine('sh: AI key missing in script. Add your API key to index.html.', 'error');
            return;
          }
          printLine('AI_Daemon: Thinking...', 'line');
          await fetchAIResponse(command);
        }
      }
    });

    async function fetchAIResponse(userPrompt) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: "You are a sarcastic, witty Linux terminal shell backend. Answer questions about software development accurately, or roast the user for typing invalid syntax or silly questions. Keep responses under 3 sentences maximum." }]
            },
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();
        const lastLine = terminal.lastChild;

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          lastLine.textContent = `AI_Daemon: ${data.candidates[0].content.parts[0].text.trim()}`;
        } else {
          lastLine.textContent = `[ERROR] Invalid API key or quota exceeded.`;
          lastLine.className = 'line error';
        }
      } catch (err) {
        terminal.lastChild.textContent = `[ERROR] Network failure connecting to API backend.`;
        terminal.lastChild.className = 'line error';
      }
    }
  </script>
</body>
</html>
